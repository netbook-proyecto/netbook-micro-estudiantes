# =======================================================================
# CONFIGURACIÓN GENERAL (netBOOK - Estudiantes)
# =======================================================================
spring.application.name=netbook-micro-estudiantes
server.port=5002
# =======================================================================
# MANEJO DE ERRORES WEB
# =======================================================================
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

# =======================================================================
# CONEXIÓN A BASE DE DATOS (Oficial: db_estudiantes)
# =======================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_estudiantes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================================
# CONFIGURACIÓN JPA / HIBERNATE (ORM)
# =======================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =======================================================================
# POOL DE CONEXIONES
# =======================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# =======================================================================
# EUREKA DISCOVERY CLIENT (Conexión al BFF)
# =======================================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/