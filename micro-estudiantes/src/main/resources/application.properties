# ===================================================================
# CONFIGURACIÓN GENERAL (netBOOK - Estudiantes)
# ===================================================================
spring.application.name=micro-estudiantes
server.port=5002

# ===================================================================
# MANEJO DE ERRORES WEB (Revelar detalles en Swagger)
# ===================================================================
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always
server.error.include-message=always

# ===================================================================
# CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS PARA DOCKER
# ===================================================================
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/db_estudiantes?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=microser_estudiantes
spring.datasource.password=Estud.2026@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN JPA / HIBERNATE (ORM)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# POOL DE CONEXIONES HIKARICP
# ===================================================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# CONFIGURACIÓN DE SWAGGER
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha

app.name=Estudiantes
app.version=1.0.1

# ===================================================================
# EUREKA DISCOVERY CLIENT (Conexión al BFF desde Docker)
# ===================================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://host.docker.internal:8761/eureka/